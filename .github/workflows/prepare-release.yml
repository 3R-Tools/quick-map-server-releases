# Creates the (empty) release that the private source repo then fills with the
# server bundle and images.
#
# Why this indirection: a release is attributed to whoever CREATES it. Creating
# it here, with this repo's own GITHUB_TOKEN, makes the author
# github-actions[bot]; the files uploaded afterwards do not change it.
#
# Triggered by the private repo via repository_dispatch:
#   gh api repos/3R-Tools/quick-map-server-releases/dispatches \
#     -f event_type=prepare-release -F client_payload[tag]=v1.0.0

name: 🤖 Prepare release

on:
  repository_dispatch:
    types: [prepare-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to prepare (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create empty release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Unexpected tag: $TAG"; exit 1 ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            exit 0
          fi

          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --title "Quick Map Server $VERSION" \
            --notes "Файли для розгортання сервера Quick Map. Інструкція — у README цього репозиторію." \
            --latest \
            --target main
          echo "Created $TAG as github-actions[bot]"
